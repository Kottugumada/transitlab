services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: transitlab
      POSTGRES_PASSWORD: transitlab
      POSTGRES_DB: transitlab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transitlab"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://transitlab:transitlab@db/transitlab
      LOCATION_LAT: "37.1305"
      LOCATION_LON: "-121.6544"
      LOCATION_NAME: "Morgan Hill, CA"
      HUNT_MAX_TARGETS: "50"
    volumes:
      - .:/app
      - ./data/cache:/app/data/cache
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
